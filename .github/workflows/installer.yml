# A full install from bootstrap.sh in a fresh container per target distro
# (tests/install-e2e.sh). The unit tests run in the Lint workflow.
name: Installer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: e2e ${{ matrix.image }} (${{ matrix.answers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "archlinux:latest", answers: workstation }
          - { image: "archlinux:latest", answers: server }
          - { image: "archlinux:latest", answers: agents }
          - { image: "debian:trixie", answers: workstation }
          - { image: "ubuntu:24.04", answers: workstation }
          - { image: "ubuntu:26.04", answers: workstation }
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" sh /src/tests/install-e2e.sh "${{ matrix.answers }}"
