# The checks the pre-commit hook runs, on every file: biome, the installer's
# typecheck and tests, shellcheck and zsh -n. See tests/lint.sh.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh shellcheck
      - run: bun install --frozen-lockfile
        working-directory: installer
      - run: sh tests/lint.sh
