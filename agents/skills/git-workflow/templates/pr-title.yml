# Squash merges turn the PR title into the commit on the default branch, so the
# title must be a Conventional Commit header. A "[WIP] " prefix keeps the check
# pending; it stands in for draft PRs where GitHub doesn't offer them.
# Added by `git wt setup`.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read
  statuses: write

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          wip: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a lowercase letter.
